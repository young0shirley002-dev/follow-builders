      min-height: 100vh;
      -webkit-font-smoothing: antialiased;

    /* 背景装饰 */
    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background:
        radial-gradient(ellipse at 20% 20%, var(--glow-purple) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, var(--glow-blue) 0%, transparent 50%);
      z-index: -1;
      animation: bgFloat 20s ease-in-out infinite alternate;

      100% { transform: translate(-5%, -5%) rotate(3deg); }

    .tweet-footer {

      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: color 0.2s;
    }
    .tweet-link:hover { color: var(--accent-cyan); }

    /* ==================== 播客卡片 ==================== */
    .podcast-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);

      align-items: center;

      padding-top: 12px;
      border-top: 1px solid var(--border-color);
      font-size: 12px;
      color: var(--text-muted);

    .blog-link {

    .footer-brand span {

    }
    .footer-note {

    }
    .footer-links a {

    /* ==================== 响应式 ==================== */
    @media (max-width: 640px) {
      .container { padding: 0 16px; }

      .highlight-card:nth-child(3) { animation-delay: 0.15s; }
      .highlight-card:nth-child(4) { animation-delay: 0.2s; }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

// ====== 工具函数 ======
function esc(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function linkify(text) {
  if (!text) return esc(text);
  // URL 转 link
  let result = esc(text).replace(
    /(https?:\/\/[^\s<]+)/g,
    '<a href="$1" target="_blank" rel="noopener" class="tweet-link">$1</a>'
  );
  // @mention
  result = result.replace(/@(\w{1,15})/g, '<a href="https://x.com/$1" target="_blank" rel="noopener" class="tweet-link">@$1</a>');
  // #hashtag
  result = result.replace(/#(\w+)/g, '<a href="https://x.com/hashtag/$1" target="_blank" rel="noopener" class="tweet-link">#$1</a>');
  return result;
}

// ====== Hero ======
function renderHero() {
  const m = DIGEST.meta;
  const s = DIGEST.stats;

  document.getElementById('heroDate').textContent = m.date;
  document.getElementById('heroStats').innerHTML = `
    <div class="stat-item"><div class="stat-value">${s.builders}</div><div class="stat-label">Builder</div></div>
    <div class="stat-item"><div class="stat-value">${s.tweets}</div><div class="stat-label">条动态</div></div>
    <div class="stat-item"><div class="stat-value">${s.podcasts}</div><div class="stat-label">期播客</div></div>
    <div class="stat-item"><div class="stat-value">${s.blogs}</div><div class="stat-label">篇文章</div></div>
  `;
}

// ====== 今日亮点 ======
function renderHighlights() {
  const container = document.getElementById('highlightsGrid');
  if (!DIGEST.highlights || DIGEST.highlights.length === 0) {
    container.innerHTML = '<p style="color:var(--text-muted);padding:20px;">暂无数据</p>';
    return;
  }

  container.innerHTML = DIGEST.highlights.map(h => `
    <div class="highlight-card">
      <span class="highlight-type type-${h.type}">${
        h.type === 'tweet' ? '📱 X动态' : h.type === 'podcast' ? '🎙️ 播客' : '📝 博客'
      }</span>
      <p class="highlight-text">${linkify(h.content)}</p>
      <div class="highlight-meta">
        <span class="highlight-source">${esc(h.source)}</span>
        ${h.url ? `<a href="${esc(h.url)}" target="_blank" rel="noopener" class="highlight-link">查看原文 →</a>` : ''}
      </div>
    </div>
  `).join('');
}

// ====== 标签云 ======
function renderTags() {
  const container = document.getElementById('tagsCloud');
  if (!DIGEST.trendingTags || DIGEST.trendingTags.length === 0) {
    container.style.display = 'none';
    return;
  }

  container.innerHTML = DIGEST.trendingTags.map(t =>
    `<span class="tag-item">#${esc(t.tag)} <span class="tag-count">${t.count}</span></span>`
  ).join('');
}

// ====== X/Twitter Builders ======
function renderBuilders() {
  const builders = DIGEST.sections?.x || [];
  const container = document.getElementById('buildersContainer');

  document.getElementById('xSubtitle').textContent =
    `${builders.length} 位 Builder · ${builders.reduce((sum, b) => sum + b.tweetCount, 0)} 条动态`;

  if (builders.length === 0) {
    container.innerHTML = '<p style="color:var(--text-muted);padding:20px;">暂无数据</p>';
    return;
  }

  container.innerHTML = builders.map(builder => `
    <div class="builder-group">
      <div class="builder-header">
        <div class="builder-avatar">${(builder.name || '?')[0]}</div>
        <div class="builder-info">
          <div class="builder-name">${esc(builder.name)}</div>
          <div class="builder-handle">@${esc(builder.handle)}</div>
        </div>
        ${builder.bio ? `<div class="builder-bio">${esc(builder.bio)}</div>` : ''}
      </div>
      <div class="tweet-list">
        ${builder.tweets.map(t => `
          <div class="tweet-card">
            <div class="tweet-body">${linkify(t.summary)}</div>
            <div class="tweet-footer">
              <div class="tweet-tags">
                ${(t.tags || []).map(tag => `<span class="tweet-tag">#${esc(tag)}</span>`).join('')}
              </div>
              <span class="tweet-time">${esc(t.timeAgo)}</span>
              ${t.url ? `<a href="${esc(t.url)}" target="_blank" rel="noopener" class="tweet-link">查看原文 ↗</a>` : ''}
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

// ====== 播客 ======
function renderPodcasts() {
  const podcasts = DIGEST.sections?.podcasts || [];
  const container = document.getElementById('podcastsContainer');

  document.getElementById('podcastSubtitle').textContent = `${podcasts.length} 期精选`;

  if (podcasts.length === 0) {
    container.innerHTML = '<p style="color:var(--text-muted);padding:20px;">暂无数据</p>';
    return;
  }

  container.innerHTML = podcasts.map(p => `
    <div class="podcast-card">
      <div class="podcast-title-row">
        <div>
          <div class="podcast-name">${esc(p.source)}</div>
          <div class="podcast-title">${esc(p.title)}</div>
        </div>
        ${p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener" class="podcast-play-btn" title="收听播客">▶</a>` : ''}
      </div>
      ${p.insights && p.insights.length > 0 ? `
        <div class="podcast-insights">
          ${p.insights.map(insight => `
            <div class="insight-item">
              <span class="insight-bullet">💡</span>
              <span>${esc(insight)}</span>
            </div>
          `).join('')}
        </div>
      ` : ''}
      ${p.keyQuote ? `<div class="podcast-quote">"${esc(p.keyQuote)}"</div>` : ''}
      <div class="podcast-footer">
        <span>${p.guests ? esc(p.guests) : ''}</span>
        ${p.duration ? `<span>⏱ ${esc(p.duration)}</span>` : ''}
        ${p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener" class="tweet-link">收听完整版 →</a>` : ''}
      </div>
    </div>
  `).join('');
}

// ====== 博客 ======
function renderBlogs() {
  const blogs = DIGEST.sections?.blogs || [];
  const container = document.getElementById('blogsContainer');

  document.getElementById('blogSubtitle').textContent = `${blogs.length} 篇文章`;

  if (blogs.length === 0) {
    container.innerHTML = '<p style="color:var(--text-muted);padding:20px;">暂无数据</p>';
    return;
  }

  container.innerHTML = blogs.map(b => `
    <div class="blog-card">
      <div class="blog-source">${esc(b.source)}</div>
      <div class="blog-title">${esc(b.title)}</div>
      <div class="blog-summary">${esc(b.summary)}</div>
      ${b.keyPoints && b.keyPoints.length > 0 ? `
        <ul class="blog-key-points">
          ${b.keyPoints.slice(0, 3).map(kp => `<li>${esc(kp)}</li>`).join('')}
        </ul>
      ` : ''}
      <div class="blog-footer">
        <span class="blog-read-time">⏱ ${esc(b.readTime)}</span>
        <span class="blog-audience">👤 ${esc(b.targetAudience)}</span>
        ${b.url ? `<a href="${esc(b.url)}" target="_blank" rel="noopener" class="blog-link">阅读全文 →</a>` : ''}
      </div>
    </div>
  `).join('');
}

// ====== 初始化渲染 ======
function init() {
  renderHero();
  renderHighlights();
  renderTags();
  renderBuilders();
  renderPodcasts();
  renderBlogs();
  document.title = `AI Builders 摘要 · ${DIGEST.meta?.dateShort || ''}`;
}

init();
</script>
